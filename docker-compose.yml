services:
  postgres:
    image: postgres:16-alpine
    container_name: tennisclub-postgres
    environment:
      POSTGRES_DB: TennisClub
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: DevPassword123!
    ports:
      - "5432:5432"
    volumes:
      - tennisclub-postgres-data:/var/lib/postgresql/data

volumes:
  tennisclub-postgres-data:
