services:
  sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: tennisclub-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DevPassword123!
    ports:
      - "1433:1433"
    volumes:
      - tennisclub-sql-data:/var/opt/mssql

volumes:
  tennisclub-sql-data:
